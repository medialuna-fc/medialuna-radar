name: Radar
# Por ahora solo manual (Actions → Radar → Run workflow). El horario cada 15 minutos se activa cuando esté listo el envío al Worker.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Radar (solo imprime tendencias; no publica nada)
        run: node radar.mjs --sin-estado --no-telegram --top 8
